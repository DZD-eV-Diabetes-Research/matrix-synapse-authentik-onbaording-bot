name: CI

# Runs on pushes to main and on pull requests, and as the first stage of every release:
# release.yml calls this workflow (workflow_call) on the tagged commit and publishes nothing unless
# every job here passes.
#
# Hardening (review findings SUP-02, SUP-04, SUP-05):
#   * The token is read-only for every job (top-level `permissions`), and checkout does not keep it
#     in .git/config (`persist-credentials: false`), so code that runs in a job (a test, a plugin,
#     a compromised dependency) cannot push.
#   * Every action is pinned to a full commit SHA; the comment names the release. Dependabot keeps
#     them current (.github/dependabot.yml).
#   * Pull requests are tested at their head commit (`github.event.pull_request.head.sha`), which is
#     also the commit the status is reported on. Never `github.head_ref`: that is a branch name in
#     the base repository and checks out the wrong code for fork PRs.
#   * Formatting is checked, not fixed: CI never commits.
#   * The GitHub Actions cache is used on push and PR runs only, never when a release runs this
#     workflow, so nothing a branch run wrote can feed a release.
#
# Duration (review decision D17): the integration job (two parallel workers, each with its own stack;
# about 12 minutes on a workstation, 22 serially) is skipped when a push or PR
# changes documentation only (scripts/ci_gate.py decides; any other or unknown path runs it). A
# skipped job counts as passed for required checks. A release always runs it, or reuses a green run
# of the tagged commit in which it ran (see release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed on the workflow too, so a release run (which calls this workflow) never shares a group
  # with the release workflow itself.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  # The commit every job tests: the PR head for pull requests, otherwise the pushed or tagged commit.
  TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PDM_VERSION: "2.27.0"
  USE_CACHE: ${{ github.event_name != 'release' }}

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.decide.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0  # the diff below needs the base commit
          persist-credentials: false

      # Fail-safe: a release, a new branch, a rewritten history or a diff that cannot be computed
      # always runs the integration suite.
      - name: Does this change need the integration suite?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          base=""
          head=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)"
            head="$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi
          if [ -n "$base" ] && files="$(git diff --name-only "$base" "$head")"; then
            echo "Changed paths:"
            printf '%s\n' "$files"
            decision="$(printf '%s\n' "$files" | python3 scripts/ci_gate.py needs-integration)"
          else
            echo "No usable diff for event ${EVENT}: running the integration suite."
            decision="$(python3 scripts/ci_gate.py needs-integration --all)"
          fi
          echo "integration=${decision}" | tee -a "$GITHUB_OUTPUT"

  quality:
    name: lint · type · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      - name: Set up PDM (Python 3.14)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.14"
          version: ${{ env.PDM_VERSION }}
          cache: ${{ env.USE_CACHE }}

      # pdm.lock is the only lockfile. Fail when it no longer matches pyproject.toml instead of
      # silently re-resolving, so CI tests exactly what the image exports.
      - name: Lockfile in sync with pyproject.toml
        run: pdm lock --check

      - name: Install dependencies
        run: pdm install --dev --frozen-lockfile

      - name: Ruff lint
        run: pdm run ruff check .

      # Formatting is checked, never auto-committed (decision D12). Fix locally with
      # `pdm run ruff format .`; the pre-commit hook does it on every commit.
      - name: Ruff format
        run: pdm run ruff format --check .

      - name: Mypy
        run: pdm run mypy onbot

      - name: Config docs in sync with the model
        run: pdm run check-config-docs

      # The fast suite has its own coverage floor (MNT-15); the full-suite gate (fail_under in
      # pyproject.toml) runs in the integration job.
      - name: Pytest (unit + contract, fast, coverage gate 90 %)
        run: pdm run pytest -m "not integration" --cov --cov-report=term-missing --cov-fail-under=90

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 0  # the commit range below needs the history
          persist-credentials: false

      # The gitleaks CLI directly: gitleaks-action needs a paid license for organisation repos.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" version

      # Every file in the checked-out tree. .gitleaks.toml allowlists only the integration-stack
      # fixtures, by path.
      - name: Scan the current tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --verbose'

      # Every commit reachable from the tested one. Since the history scrub (review session S16)
      # the whole history is clean, so a full scan is cheap (a few seconds) and also catches a
      # secret that was added and removed again inside one PR.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

  image:
    name: image build · smoke test
    runs-on: ubuntu-latest
    # The Dockerfile is only exercised here before a release pushes it. Plain `docker build`, no
    # registry, no credentials. The release builds the same Dockerfile again from a git context.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      - name: Build
        run: docker build --build-arg PDM_BUILD_SCM_VERSION=0.0.0rc0 -t onbot:ci .

      - name: Smoke test
        run: |
          docker run --rm onbot:ci --version | tee version.txt
          grep -qx "onbot 0.0.0rc0" version.txt
          docker run --rm onbot:ci healthcheck --help >/dev/null
          # The runtime venv holds the locked runtime packages and onbot, and no pip.
          docker run --rm --entrypoint /opt/venv/bin/python onbot:ci -c \
            "import importlib.util as u, sys; sys.exit(u.find_spec('pip') is not None)"

  integration:
    name: integration (live Synapse · MAS · Authentik)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    # Slow (boots a 6-container stack) and needs Docker, so it is kept apart from the fast quality job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false

      - name: Set up PDM (Python 3.14)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.14"
          version: ${{ env.PDM_VERSION }}
          cache: ${{ env.USE_CACHE }}

      - name: Install dependencies
        run: pdm install --dev --frozen-lockfile

      # The full suite (incl. integration); the testcontainers fixture brings up the stack. This is
      # the authoritative coverage gate: app.py + __main__.py are exercised end-to-end here.
      # Two pytest-xdist workers, each with a stack of its own (review decision D17): the runner has
      # 4 CPUs and 16 GB, a stack needs 2 to 3 GB. A stack that cannot start still fails the job.
      - name: Pytest (full suite + coverage gate)
        env:
          ONBOT_ITEST_WORKERS: "2"
        run: ./run_integration_tests.sh
