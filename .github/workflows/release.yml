name: Release

# Build and publish the Docker image (dzdde/onbot) and the PyPI package (onbot) when a GitHub Release
# is published. Full flow and the maintainer checklist: docs/development.md, "Releasing".
#
#   1. version   derives ONE version from the tag (scripts/release_version.py): validates it as a
#                PEP 440 release, normalises it (0.1.0-beta.1 becomes 0.1.0b1), checks that the
#                release's "pre-release" checkbox agrees with it, and that the tagged commit is on
#                main. Both artifacts get exactly this version (review finding SUP-06).
#   2. ci-reuse  looks for a green CI run of exactly the tagged commit (a push to main in which all
#                four jobs, the integration suite included, passed; scripts/ci_gate.py). If there is
#                one, its result is reused and step 3 is skipped (review decision D17, saves about
#                20 minutes). Any doubt (no such run, an API error) means no reuse.
#   3. ci        otherwise runs the complete CI workflow (lint, types, unit, secret scan, image smoke
#                test, integration suite) on the tagged commit. Nothing is published unless step 2
#                or step 3 vouches for the commit (SUP-02).
#   4. build-dist builds sdist and wheel without any secret in reach and checks their names and
#                that the sdist ships no test fixtures.
#   5. publish-pypi and publish-image run in the `release` environment, the only place that holds the
#                publish credentials (maintainer action: protect it with a required reviewer).
#
# Channels, by version (the checkbox must match):
#   * pre-release (0.2.0b1, 0.2.0rc1): image tags <version> and `beta`; PyPI pre-release, installed
#     only with `pip install --pre`.
#   * stable (0.2.0, 0.2.0.post1): image tags <version>, <major>.<minor>, <major> and `latest`;
#     PyPI stable.
#
# Hardening (SUP-04): read-only token by default, each job asks only for what it needs; actions
# pinned by commit SHA; no GitHub Actions cache anywhere in a release; credentials only in the two
# publish jobs. PyPI: the job is ready for Trusted Publishing (`id-token: write`, environment
# `release`). While the repository secret PYPI_API_TOKEN exists it is used; once the maintainer has
# configured the Trusted Publisher on PyPI and deleted that secret, the publish action falls back to
# Trusted Publishing on its own (and then also uploads PEP 740 attestations).

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dzdde/onbot
  PDM_VERSION: "2.27.0"

jobs:
  version:
    name: derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      docker-tags: ${{ steps.derive.outputs.docker-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all branches, for the "is on main" check
          persist-credentials: false

      - name: Tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${TAG} points at ${GITHUB_SHA}, which is not on main. Release from main only."
            exit 1
          fi

      - name: Set up PDM (Python 3.14)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.14"
          version: ${{ env.PDM_VERSION }}
          cache: false

      # Only the `build` group (packaging, pdm-backend), exactly as locked.
      - name: Install release tooling
        run: pdm install --frozen-lockfile --no-self --no-default --group build

      - name: Derive version
        id: derive
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: >-
          pdm run python scripts/release_version.py derive "$TAG"
          --prerelease-flag "$PRERELEASE"
          --image "$IMAGE_NAME"
          --github-output "$GITHUB_OUTPUT"

  ci-reuse:
    name: reuse the CI result of the tagged commit
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # list the CI runs and their jobs
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push run on main of the same commit tested the same tree with the same ci.yml. It may
      # have used the Actions cache, which on main only holds what main runs wrote.
      - name: Look for a green CI run of this commit on main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          reuse=false
          if gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&status=success&per_page=50" > "$RUNNER_TEMP/runs.json"; then
            run_id="$(python3 scripts/ci_gate.py pick-run "$RUNNER_TEMP/runs.json" "$GITHUB_SHA")"
            if [ -n "$run_id" ] && gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=50" > "$RUNNER_TEMP/jobs.json"; then
              reuse="$(python3 scripts/ci_gate.py reuse "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/jobs.json" "$GITHUB_SHA")"
            fi
          fi
          if [ "$reuse" = "true" ]; then
            msg="Reusing CI run ${run_id} of ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${run_id}"
          else
            msg="No reusable CI run of ${GITHUB_SHA}; running the full CI."
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: [version, ci-reuse]
    # Also runs when ci-reuse itself failed: no reuse then, the full CI decides.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.ci-reuse.outputs.reuse != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-dist:
    name: build sdist + wheel
    needs: [version, ci-reuse, ci]
    # The gate: the full CI passed, or a green CI run of this commit was reused.
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci-reuse.outputs.reuse == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PDM (Python 3.14)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.14"
          version: ${{ env.PDM_VERSION }}
          cache: false

      - name: Install release tooling
        run: pdm install --frozen-lockfile --no-self --no-default --group build

      # --no-isolation: build with the locked, hash-verified pdm-backend from the `build` group
      # instead of downloading whatever pdm-backend is newest. The version comes from the version
      # job, the same value the image gets.
      - name: Build
        env:
          PDM_BUILD_SCM_VERSION: ${{ needs.version.outputs.version }}
        run: pdm build --no-isolation

      - name: Check the artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pdm run python scripts/release_version.py check-dist "$VERSION" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish (PyPI)
    needs: [version, ci-reuse, ci, build-dist]
    # build-dist only succeeds behind the gate.
    if: ${{ !cancelled() && needs.build-dist.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/onbot/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing (used once PYPI_API_TOKEN is gone, see header)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # skip-existing keeps a re-run from failing when a file of this version is already on PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-image:
    name: publish image (Docker Hub)
    needs: [version, ci-reuse, ci]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci-reuse.outputs.reuse == 'true')) }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://hub.docker.com/r/dzdde/onbot/tags
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_DZD_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DZD_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built from a git context of the tagged commit (no checkout): BuildKit fetches exactly the
      # tracked files of that commit, so nothing untracked can enter the image (SUP-17). No cache:
      # every release image is built from scratch.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          push: true
          pull: true
          no-cache: true
          tags: ${{ needs.version.outputs.docker-tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PDM_BUILD_SCM_VERSION=${{ needs.version.outputs.version }}
          # BuildKit provenance (mode=max) and SBOM attestations, attached to the image index.
          provenance: mode=max
          sbom: true
