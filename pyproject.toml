[project]
name = "onbot"
# Version is derived from the git tag by pdm-backend (see [tool.pdm.version]). Tag a release
# (e.g. 0.1.0b3) and the built artifact carries that version — never hand-edit a version here.
dynamic = ["version"]
description = "Keep a Matrix (Synapse) homeserver in sync with Authentik and onboard new users."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "DZD" }]
keywords = ["matrix", "synapse", "authentik", "mas", "bot", "onboarding"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

# Runtime deps for the new architecture (AD-7). The Matrix client library decision
# (matrix-nio vs raw httpx vs mautrix) is deferred to a Phase 6 ADR, so no Matrix
# library is pinned here yet.
#
# Version policy (review finding SUP-13): the Docker image is the supported install and is built
# from pdm.lock, so it always runs exactly the tested set. For `pip install onbot`, every runtime
# dependency is capped below its next major release, so a breaking upstream major never reaches a
# PyPI install untested. Raising a cap is a deliberate change: bump it here, `pdm lock`, run the full
# suite. The lower bounds are not tested in CI (CI runs the locked versions only).
dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=9.0,<10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "markdown-it-py[linkify]>=3.0,<5",
]

[project.scripts]
onbot = "onbot.cli:main"

[project.urls]
Homepage = "https://github.com/DZD-eV-Diabetes-Research/matrix-synapse-authentik-onbaording-bot"

[build-system]
# Capped like the runtime deps. The Docker image and the release build use the exact pdm-backend
# from pdm.lock (dependency group `build`) instead, see Dockerfile and release.yml.
requires = ["pdm-backend>=2.4,<3"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

# Derive the package version from the git tag (setuptools-scm style). In CI the Docker build has no
# .git in its context, so the release workflow passes the version via the PDM_BUILD_SCM_VERSION env
# var instead; fallback_version keeps a git-less local build (e.g. `pip install .`) from failing.
[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

# The sdist carries the package, pyproject.toml, README and LICENSE only. tests/ would otherwise be
# included by default, and tests/integration/stack holds fixed, public test-only keys and secrets
# (review finding SUP-15) that have no business on PyPI and trip every secret scanner.
[tool.pdm.build]
excludes = ["tests"]

[tool.pdm.scripts]
# Regenerate the committed config reference + YAML template from onbot/config.py (psyplus).
gen-config-docs = "python scripts/gen_config_docs.py"
# CI/pre-commit drift guard: fail if the committed docs no longer match the model.
check-config-docs = "python scripts/gen_config_docs.py --check"

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]

# --- Mypy: type checking -----------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
exclude = ["legacy/"]

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests against a live Synapse/MAS/Authentik stack (own CI job).",
]

[tool.coverage.run]
source = ["onbot"]
branch = true
# Phase 7b: nothing is omitted. The composition root (`app.py`) is now exercised end-to-end by the
# integration harness (live Synapse+MAS+Authentik) and `__main__.py` by a unit import test. The
# authoritative coverage gate runs in the *integration* CI job (the full suite, where app.py's code
# paths execute); the fast job reports coverage without gating (it cannot reach app.py).

[tool.coverage.report]
# Phase 7 coverage gate (BATTLE_PLAN §5): a floor over the FULL suite, meant to ratchet upward.
fail_under = 88
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Protocol method bodies
    "if __name__ == .__main__.:",
]

[dependency-groups]
# Tools that build the release artifacts, locked with hashes like everything else: pdm-backend builds
# the wheel inside the Docker image (no build isolation, no unpinned download), and packaging
# validates and normalises the release version (scripts/release_version.py).
build = [
    "pdm-backend>=2.4,<3",
    "packaging>=24",
]
dev = [
    {include-group = "build"},
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "testcontainers>=4.0",
]
docs = [
    "psyplus>=1.0.0",
]
