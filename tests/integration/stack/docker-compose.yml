# Phase 7b live integration stack: Synapse + MAS + Postgres + Authentik (ADR-0006 topology).
# Brought up by tests/integration/conftest.py via testcontainers. Images are pinned by digest.
#
# Parallel instances: the project name and every published host port come from ONBOT_ITEST_*
# variables (defaults below are instance 0). The harness derives them from ONBOT_ITEST_INSTANCE in
# tests/integration/stack_instance.py and passes them in with --env-file; see tests/README.md.
# Container ports and in-network URLs (`mas:8080`, `authentik-server:9000`, `synapse:8008`) never
# change, so the issuer strings in mas/config.yaml and synapse/homeserver.yaml stay valid for every
# instance; the host-side login helper rewrites those hostnames to localhost:<host port> on browser
# hops. One value in synapse/homeserver.yaml (public_baseurl) names the instance 0 host port; Synapse
# only advertises it to clients and the harness never follows it.
#
# Every published port binds to 127.0.0.1 only (review finding SUP-15). The stack runs with fixed,
# public admin credentials (Authentik bootstrap password and token, MAS admin client secret), and
# Docker's port publishing bypasses host firewalls, so on 0.0.0.0 anyone on the same network could
# log in as admin while the stack is up.
name: ${ONBOT_ITEST_PROJECT:-onbot-itest}

services:
  postgres:
    image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: onbot
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/10-init-dbs.sh:/docker-entrypoint-initdb.d/10-init-dbs.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server@sha256:377ee38726785f98aafc3665202ad198a366fa979b0f61c0660a9c05e3a9b1b3
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: "onbot-integration-authentik-secret-key-do-not-use-in-prod"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: onbot
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: "onbot-admin-password"
      AUTHENTIK_BOOTSTRAP_TOKEN: "onbot-authentik-bootstrap-token"
      AUTHENTIK_BOOTSTRAP_EMAIL: "admin@onbot.test"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_AVATARS: "none"
    volumes:
      - ./authentik/blueprints/onbot.yaml:/blueprints/onbot.yaml:ro
    ports:
      - "127.0.0.1:${ONBOT_ITEST_AUTHENTIK_PORT:-9000}:9000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 120s

  authentik-worker:
    image: ghcr.io/goauthentik/server@sha256:377ee38726785f98aafc3665202ad198a366fa979b0f61c0660a9c05e3a9b1b3
    command: worker
    environment: *authentik_env
    volumes:
      - ./authentik/blueprints/onbot.yaml:/blueprints/onbot.yaml:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 120s

  mas:
    # MAS 1.28.0 (tag 1.28.0, the current stable release and what the deployment's `:latest` resolves
    # to). Its admin API can finish sessions and deactivate without GDPR erasure, which the lifecycle
    # tests rely on (tests/integration/test_lifecycle.py asserts both capabilities).
    image: ghcr.io/element-hq/matrix-authentication-service@sha256:494c67f08ee8344368f4ed336611dea02b26c4e058bf37a212d090d50b612659
    # Distroless image; entrypoint is `mas-cli`. The server applies pending DB migrations and
    # synchronises config-defined clients/upstream providers on startup.
    command: ["server", "--config", "/config/config.yaml"]
    volumes:
      - ./mas/config.yaml:/config/config.yaml:ro
    ports:
      - "127.0.0.1:${ONBOT_ITEST_MAS_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}

  synapse:
    # Synapse 1.164.2 (tag v1.164.2, the current stable release; the deployment runs `:latest`).
    # Supports room version 12, which the stack forces as its default (see `default_room_version` in
    # synapse/homeserver.yaml) so the integration suite exercises the v12 world the bot now runs in:
    # creator absent from power_levels, domainless room IDs.
    image: ghcr.io/element-hq/synapse@sha256:f0df87cff259872637b4b5e5174b9977e5e3046dd421505407803b5e45c5f842
    # Wait for MAS (auth is delegated to it), generate the signing key, then run.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        until curl -sfo /dev/null http://mas:8080/.well-known/openid-configuration; do
          echo 'waiting for MAS...'; sleep 2;
        done;
        python -m synapse.app.homeserver --config-path /config/homeserver.yaml --generate-keys &&
        exec python -m synapse.app.homeserver --config-path /config/homeserver.yaml
    volumes:
      - ./synapse/homeserver.yaml:/config/homeserver.yaml:ro
      - ./synapse/log.config:/config/log.config:ro
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${ONBOT_ITEST_SYNAPSE_PORT:-8008}:8008"
    depends_on:
      postgres: {condition: service_healthy}
      mas: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s
